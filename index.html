<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT.z — Tether USD Bridged ZED20 (BEP20)</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#0e1116; color:#e8ecf1; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { width:min(440px,92vw); background:#161b22; border:1px solid #232a33; border-radius:20px; padding:28px; text-align:center; }
  .logo { width:96px; height:96px; border-radius:50%; margin:0 auto 14px; display:block; border:2px solid #26A17B; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sym { color:#8b949e; font-size:14px; margin-bottom:18px; }
  .addr { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#58a6ff; word-break:break-all; background:#0d1117; border:1px solid #21262d; border-radius:10px; padding:10px; margin-bottom:16px; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border-radius:12px; border:0; cursor:pointer; background:#26A17B; color:#fff; }
  button:active { transform:scale(.98); }
  .msg { font-size:12px; margin-top:12px; min-height:18px; color:#8b949e; word-break:break-word; text-align:left; }
  .ok { color:#3fb950; } .err { color:#f85149; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" alt="USDT.z" src="https://coin-images.coingecko.com/coins/images/38064/large/usdt-z.png?1716441672"
       onerror="this.src='https://raw.githubusercontent.com/luccmick121/assets/master/blockchains/smartchain/assets/0x4BE31a5FBEEa7D73b59Ae538B56dAC7A60aB7Db4/logo.png'">
  <h1>Tether USD Bridged ZED20</h1>
  <div class="sym">USDT.z · BEP20 · BNB Smart Chain</div>
  <div class="addr">0x4BE31a5FBEEa7D73b59Ae538B56dAC7A60aB7Db4</div>
  <button id="add">Add to Wallet</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const TOKEN = {
  address: "0x4BE31a5FBEEa7D73b59Ae538B56dAC7A60aB7Db4",
  symbol: "USDT.z",
  decimals: 18,
  image: "https://coin-images.coingecko.com/coins/images/38064/large/usdt-z.png?1716441672"
};
const msg = document.getElementById("msg");
function show(t, cls) { msg.textContent = t; msg.className = "msg " + (cls || ""); }
function walletInfo(eth) {
  if (!eth) return "sem wallet";
  const p = [];
  if (eth.isMetaMask) p.push("MetaMask");
  if (eth.isBinance || eth.isBinanceWallet) p.push("Binance");
  if (eth.isOKXWallet) p.push("OKX");
  if (eth.isRabby) p.push("Rabby");
  if (eth.isCoinbaseWallet) p.push("Coinbase");
  if (!p.length) p.push("?");
  return p.join("+") + " · chain=" + (eth.chainId || "?") + (eth.providers ? " · multi(" + eth.providers.length + ")" : "");
}
function pickProvider() {
  // Binance Web3 injeta como window.binancewallet
  if (window.binancewallet && window.binancewallet.request) return window.binancewallet;
  const w = window.ethereum;
  if (!w) return null;
  if (w.providers && w.providers.length) {
    return w.providers.find(p => p.isBinance || p.isBinanceWallet)
        || w.providers.find(p => p.isMetaMask)
        || w.providers[0];
  }
  return w;
}
function globalsFound() {
  const nomes = ["ethereum","binancewallet","BinanceWallet","okxwallet","tronLink","tokenpocket"];
  return nomes.filter(n => !!window[n]).join(",") || "nenhum";
}
document.getElementById("add").addEventListener("click", async () => {
  const eth = pickProvider();
  if (!eth) { show("No wallet found. globals: " + globalsFound(), "err"); return; }
  show("wallet: " + walletInfo(eth) + " — switching to BNB Chain (0x38)…");
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x38" }] });
    show("wallet: " + walletInfo(eth) + " — rede BNB ok, pedindo watchAsset…");
  } catch (e) {
    show("switch falhou: " + (e.message || e) + " · wallet: " + walletInfo(eth), "err"); return;
  }
  try {
    await eth.request({ method: "wallet_watchAsset", params: { type: "ERC20", options: TOKEN } });
    show("✅ USDT.z adicionado com logo! wallet: " + walletInfo(eth), "ok");
  } catch (e) {
    show("watchAsset falhou: " + (e.message || e) + " · wallet: " + walletInfo(eth), "err");
  }
});
</script>
</body>
</html>
